# Training Hyperparameters and Environment Configuration
model:
  name: "EleutherAI/pythia-70m"
  version: "v1"

hyperparameters:
  random_seed: 42
  learning_rate: 0.0005
  batch_size: 8
  num_epochs: 3
  max_seq_length: 128

library_versions:
  torch: "2.15.0+cpu"
  transformers: "5.22.1"
  numpy: "2.5.4"
  pyyaml: "6.0.3"
  python: "3.12.3"
