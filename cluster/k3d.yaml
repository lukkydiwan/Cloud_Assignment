apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloud-cluster
servers: 1
agents: 0
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8333:8333
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%
        nodeFilters:
          - server:*
